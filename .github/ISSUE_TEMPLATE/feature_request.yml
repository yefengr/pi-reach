name: 功能建议 / Feature request
description: 建议新功能或改进 / Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看 README 的[非目标](https://github.com/yefengr/pi-reach#非目标)和[已关闭决策](https://github.com/yefengr/pi-reach/blob/main/docs/adr/20260518-closed-decisions.md)；其中已有结论的方向，需要新的证据才会重新讨论。
        Before submitting, check the [non-goals](https://github.com/yefengr/pi-reach/blob/main/README.en.md#non-goals) and the [closed decisions](https://github.com/yefengr/pi-reach/blob/main/docs/adr/20260518-closed-decisions.md); directions already decided there are reopened only with new evidence.
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 在什么场景下遇到了什么困难 / The situation and the difficulty you ran into
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案 / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案 / Alternatives considered
