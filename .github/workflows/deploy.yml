# 单次构建 → staging 自动检查与真机验收 → production 审批 → 同 digest 晋升 → Release。
# 仅 main 版本变化或手动触发；候选修复合入 main 后手动重新构建同一个未发布版本。
# Environment/服务器的一次性配置与排队补跑见 docs/DEPLOYMENT.md。
name: Deploy PWA & Relay

on:
  push:
    branches: [main]
    paths: [relay/package.json, pwa/package.json]
  workflow_dispatch:
    inputs:
      component:
        description: 要部署的组件
        type: choice
        options: [both, relay, pwa]
        default: both

permissions:
  contents: read

# 包含审批等待期，防止另一候选覆盖 staging。GitHub 只保留一个 pending run；被替换者需手动补跑。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relay: ${{ steps.decide.outputs.relay }}
      relay-version: ${{ steps.decide.outputs.relay-version }}
      pwa: ${{ steps.decide.outputs.pwa }}
      pwa-version: ${{ steps.decide.outputs.pwa-version }}
      image-prefix: ${{ steps.decide.outputs.image-prefix }}
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what to deploy
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          CHOICE: ${{ inputs.component }}
          PUSH_BEFORE: ${{ github.event.before }}
          OWNER: ${{ github.repository_owner }}
        run: |
          note() {
            echo "$1"
            echo "- $1" >> "$GITHUB_STEP_SUMMARY"
          }
          for component in relay pwa; do
            version="$(jq -r .version "$component/package.json")"
            selected=true
            if [ "$EVENT" = workflow_dispatch ]; then
              case "$CHOICE" in both | "$component") ;; *) selected=false ;; esac
            elif git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              previous="$(git show "$PUSH_BEFORE:$component/package.json" 2>/dev/null | jq -r .version 2>/dev/null || true)"
              if [ "$previous" = "$version" ]; then
                note "$component 版本仍为 ${version}，跳过。"
                selected=false
              fi
            fi
            if [ "$selected" = true ] && git rev-parse -q --verify "refs/tags/$component-v$version" >/dev/null; then
              note "$component-v$version 已发布，跳过。"
              selected=false
            fi
            if [ "$selected" = true ]; then note "部署 $component $version。"; fi
            echo "$component=$selected" >> "$GITHUB_OUTPUT"
            echo "$component-version=$version" >> "$GITHUB_OUTPUT"
          done
          echo "image-prefix=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          note "若排队运行被替换或候选被拒：修复合并 main 后手动运行，再完成 staging 与真机验收；不得沿用旧 digest 证据。"

  build:
    name: build
    needs: plan
    if: needs.plan.outputs.relay == 'true' || needs.plan.outputs.pwa == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      relay-digest: ${{ steps.relay.outputs.digest }}
      pwa-digest: ${{ steps.pwa.outputs.digest }}
    env:
      PLATFORM: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
      SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Relay
        id: relay
        if: needs.plan.outputs.relay == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: relay/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ needs.plan.outputs.image-prefix }}/pi-reach-relay:v${{ needs.plan.outputs.relay-version }}
          labels: |
            pi-reach.image=relay
            org.opencontainers.image.source=${{ env.SOURCE }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.relay-version }}
      - name: Attest Relay
        if: needs.plan.outputs.relay == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.plan.outputs.image-prefix }}/pi-reach-relay
          subject-digest: ${{ steps.relay.outputs.digest }}
          push-to-registry: true
      - name: Build and push PWA
        id: pwa
        if: needs.plan.outputs.pwa == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: pwa/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ needs.plan.outputs.image-prefix }}/pi-reach-pwa:v${{ needs.plan.outputs.pwa-version }}
          labels: |
            pi-reach.image=pwa
            org.opencontainers.image.source=${{ env.SOURCE }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.pwa-version }}
      - name: Attest PWA
        if: needs.plan.outputs.pwa == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.plan.outputs.image-prefix }}/pi-reach-pwa
          subject-digest: ${{ steps.pwa.outputs.digest }}
          push-to-registry: true

  staging:
    name: staging
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.PWA_URL }}
    permissions:
      contents: read
    outputs:
      baseline: ${{ steps.test.outputs.baseline }}
      tested: ${{ steps.test.outputs.tested }}
      target: ${{ steps.test.outputs.target }}
    env:
      IMAGE_PREFIX: ${{ needs.plan.outputs.image-prefix }}
      SELECT_RELAY: ${{ needs.plan.outputs.relay }}
      SELECT_PWA: ${{ needs.plan.outputs.pwa }}
      RELAY_IMAGE: ${{ needs.plan.outputs.image-prefix }}/pi-reach-relay:v${{ needs.plan.outputs.relay-version }}@${{ needs.build.outputs.relay-digest }}
      PWA_IMAGE: ${{ needs.plan.outputs.image-prefix }}/pi-reach-pwa:v${{ needs.plan.outputs.pwa-version }}@${{ needs.build.outputs.pwa-digest }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      PWA_URL: ${{ vars.PWA_URL }}
      RELAY_URL: ${{ vars.RELAY_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Align, deploy and smoke staging
        id: test
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: node scripts/deploy-ci.mjs staging
      - name: Remove temporary SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP"/pi-reach-deploy-*

  production:
    name: production
    needs: [plan, build, staging]
    # 默认 success() 依赖，失败/取消/跳过的 staging 不能进入生产。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PWA_URL }}
    permissions:
      contents: write
    env:
      IMAGE_PREFIX: ${{ needs.plan.outputs.image-prefix }}
      SELECT_RELAY: ${{ needs.plan.outputs.relay }}
      SELECT_PWA: ${{ needs.plan.outputs.pwa }}
      RELAY_IMAGE: ${{ needs.plan.outputs.image-prefix }}/pi-reach-relay:v${{ needs.plan.outputs.relay-version }}@${{ needs.build.outputs.relay-digest }}
      PWA_IMAGE: ${{ needs.plan.outputs.image-prefix }}/pi-reach-pwa:v${{ needs.plan.outputs.pwa-version }}@${{ needs.build.outputs.pwa-digest }}
      BASELINE: ${{ needs.staging.outputs.baseline }}
      TESTED: ${{ needs.staging.outputs.tested }}
      STAGING_TARGET: ${{ needs.staging.outputs.target }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      PWA_URL: ${{ vars.PWA_URL }}
      RELAY_URL: ${{ vars.RELAY_URL }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Verify candidate, promote immutable images and check production
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: node scripts/deploy-ci.mjs production
      - name: Create or repair production tags and Releases
        run: bash scripts/deploy-release.sh
      - name: Remove temporary SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP"/pi-reach-deploy-*
