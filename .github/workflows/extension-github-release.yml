# Extension GitHub Release：Extension 在 npm 上线后，基于 extension-vX.Y.Z 标签创建 GitHub Release（当前版本标记 Latest）。
# - 背景：Extension npm 工作流（release.yml）提交待审并打标签后结束，维护者在 npmjs.com 批准的时刻 GitHub 无法感知，
#   因此定时检查：当前版本已在 npm 上而 Release 缺失时创建；尚未批准时跳过，下次再查。
# - 不创建标签：GITHUB_TOKEN 无法给 .github/workflows 与 main 最新提交不同的提交打标签。已上线但缺少标签时失败，
#   由维护者手工打标签后重新运行。
# - 触发：每 30 分钟一次；也可在 Actions 页面手动运行，并可指定要补建的历史版本。
# - 逻辑在 scripts/extension-github-release.sh。
# 流程见 docs/DEPLOYMENT.md「版本标签与 GitHub Release」。
name: Extension GitHub Release

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: 要补建的历史版本（X.Y.Z），留空使用当前版本
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: extension-github-release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/extension-github-release.sh release ${VERSION:+"$VERSION"}
