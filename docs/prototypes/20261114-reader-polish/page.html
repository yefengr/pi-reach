<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阅读器 · 文档、源码、差异与命令</title>
<link rel="stylesheet" href="./shared.css">
</head>
<body>
<div class="shell">
  <header class="toolbar">
    <div class="toolbar-copy">
      <div class="title-line">
        <h1>阅读器 · 内容视图</h1>
        <span class="review-chip">已失效 · 规则已同步 DESIGN</span>
      </div>
      <p class="toolbar-desc">此页保留已确认的合成评审样例。正式规则见 docs/DESIGN.md，当前实现请查看 PWA 的 /app/ui-states；本页不作为实现真源。</p>
    </div>
    <div class="controls">
      <div class="control wide">
        <span class="control-label">场景</span>
        <select id="sceneSelect" aria-label="选择阅读器场景">
          <option value="edit">Edit · 统一差异</option>
          <option value="write">Write · 文档</option>
          <option value="write-code">Write · 源码</option>
          <option value="read">Read · 源码与实际行号</option>
          <option value="read-document">Read · 文档</option>
          <option value="search">Search · 搜索结果</option>
          <option value="bash-run">Run · 运行中长日志</option>
          <option value="bash-fail">Run · 失败长日志</option>
          <option value="markdown">已发布文档 · 长目录</option>
          <option value="edit-unavailable">Edit · 未返回差异（降级）</option>
        </select>
      </div>
      <div class="control">
        <span class="control-label">外观</span>
        <div class="seg" role="group" aria-label="外观">
          <button type="button" data-theme-set="light" aria-pressed="true">浅色</button>
          <button type="button" data-theme-set="dark" aria-pressed="false">深色</button>
        </div>
      </div>
      <div class="control">
        <span class="control-label">字号</span>
        <div class="seg" role="group" aria-label="字号">
          <button type="button" data-size-set="standard" aria-pressed="true">标准</button>
          <button type="button" data-size-set="large" aria-pressed="false">大</button>
          <button type="button" data-size-set="xlarge" aria-pressed="false">特大</button>
        </div>
      </div>
      <div class="control">
        <span class="control-label">画布</span>
        <div class="seg" role="group" aria-label="画布宽度">
          <button type="button" data-viewport-set="phone" aria-pressed="true">手机 390</button>
          <button type="button" data-viewport-set="desktop" aria-pressed="false">桌面 720</button>
        </div>
      </div>
    </div>
  </header>

  <main class="stage">
    <section class="reader" id="reader" data-viewport="phone" data-size="standard" aria-label="阅读器效果稿画布">
      <div class="reader-bar" id="readerBar"></div>
      <div class="reader-body" id="readerBody"></div>
    </section>
  </main>

  <footer class="notes">
    <p class="scene-note" id="sceneNote"></p>
    <p class="hint">静态效果稿：数据为合成样例，未覆盖真实手势、系统返回、历史记录、焦点管理与网络状态，也不代表真实测试结果。</p>
  </footer>
</div>
<script src="./shared.js"></script>
</body>
</html>
