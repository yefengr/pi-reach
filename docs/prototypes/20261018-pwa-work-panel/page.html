<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Pi Reach · 工作面板模拟</title>
  <link rel="stylesheet" href="./shared.css">
  <script src="./shared.js" defer></script>
</head>
<body>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></symbol>
    <symbol id="i-theme" viewBox="0 0 24 24"><path d="M20.5 13A9 9 0 0 1 11 3.5 9 9 0 1 0 20.5 13Z"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m4 5 6 6-6 6m9 0h7"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m10 5-7 7 7 7M3 12h18"/></symbol>
  </svg>

  <header class="review-bar" aria-label="原型评审工具">
    <div class="review-label"><strong>阶段 D · 工作面板模拟</strong><span>仅模拟，不连接 Pi</span></div>
    <div class="review-controls">
      <div class="segmented" role="group" aria-label="阅读布局">
        <button type="button" data-mode="overlay" aria-pressed="false">当前覆盖式</button>
        <button type="button" data-mode="split" aria-pressed="true">候选并排</button>
      </div>
      <div class="segmented" role="group" aria-label="预览尺寸">
        <button type="button" data-size="auto" aria-pressed="true">自适应</button>
        <button type="button" data-size="phone" aria-pressed="false">手机宽度</button>
      </div>
      <button class="icon-button" type="button" data-action="theme" aria-label="切换为深色" title="切换明暗"><svg><use href="#i-theme"/></svg></button>
      <button class="review-reset" type="button" data-action="reset"><svg><use href="#i-reset"/></svg><span>重置</span></button>
    </div>
  </header>

  <main class="preview-stage" aria-label="Pi Reach 评审原型">
    <div id="app" data-size="auto">
      <nav class="sidebar" aria-label="模拟会话">
        <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M13 17h31c3 0 5 2 5 5v4H13c-1.1 0-2-.9-2-2v-5c0-1.1.9-2 2-2Z"/><path d="M17 26h8v22c0 1.1-.9 2-2 2h-4c-1.1 0-2-.9-2-2V26Z"/><path d="M40 26h8v17c0 5 2 6 7 5v7c-10 2-15-2-15-11V26Z"/></svg><span>Pi Reach</span></div>
        <div class="computer"><span class="online-dot"></span><span>我的电脑</span><span class="simulation-tag">模拟</span></div>
        <div class="session-list">
          <p class="group-label">在线 Pi</p>
          <button type="button" data-session="main" aria-current="true"><span class="session-dot"></span><span><strong>界面调整</strong><small>pi-reach</small></span></button>
          <button type="button" data-session="other" aria-current="false"><span class="session-dot muted-dot"></span><span><strong>发布前检查</strong><small>pi-reach</small></span></button>
          <p class="session-note">两段独立的模拟会话</p>
        </div>
        <div class="sidebar-foot"><svg><use href="#i-panel"/></svg><span>工作面板评审</span><small>本地模拟</small></div>
      </nav>

      <section id="workspace" data-layout="closed" aria-label="工作区">
        <section id="conversation" aria-label="对话">
          <header class="conversation-header">
            <h1 id="conversation-title" tabindex="-1"><span>pi-reach</span><span class="title-divider">·</span><span id="session-title">界面调整</span></h1>
            <label class="mobile-session"><span class="visually-hidden">切换模拟会话</span><select id="session-select"><option value="main" data-session="main">界面调整</option><option value="other" data-session="other">发布前检查</option></select></label>
            <span class="connection"><span class="online-dot"></span><span>模拟会话</span></span>
          </header>
          <div id="messages" tabindex="0" aria-label="会话消息">
            <div id="message-list" class="reading-column"></div>
          </div>
          <form id="composer" aria-label="模拟消息输入区">
            <div class="composer-inner">
              <p class="simulation-hint">仅模拟发送 · 内容只保留在当前页面</p>
              <div class="composer-surface">
                <label class="visually-hidden" for="draft">发送消息</label>
                <textarea id="draft" rows="2" placeholder="继续聊聊这份说明…" autocomplete="off"></textarea>
                <button id="send" type="submit" aria-label="模拟发送" title="模拟发送"><svg><use href="#i-send"/></svg></button>
              </div>
            </div>
          </form>
        </section>

        <div id="resize-slot" hidden>
          <div id="resize-handle" role="separator" tabindex="0" aria-label="调整工作面板宽度" aria-orientation="vertical" aria-controls="detail-pane" aria-valuemin="360" aria-valuemax="440" aria-valuenow="440"><span></span></div>
        </div>
        <aside id="detail-pane" aria-label="工作面板" hidden>
          <section id="detail-content" aria-labelledby="detail-title">
            <header class="detail-header">
              <svg class="detail-file-icon"><use id="detail-icon" href="#i-file"/></svg>
              <div class="detail-heading"><p id="detail-kind">文件 · 只读预览</p><h2 id="detail-title" tabindex="-1">界面调整说明.md</h2></div>
              <button class="icon-button" type="button" data-action="close-detail" aria-label="关闭工作面板" title="关闭工作面板"><svg><use href="#i-close"/></svg></button>
            </header>
            <div class="detail-toolbar">
              <button type="button" data-action="return-chat"><svg><use href="#i-back"/></svg>回到对话</button>
              <div id="width-controls"><output id="width-value">440 px</output><button class="icon-button" type="button" data-action="reset-width" aria-label="恢复默认宽度" title="恢复默认宽度"><svg><use href="#i-reset"/></svg></button></div>
              <span id="overlay-label" hidden>覆盖阅读</span>
            </div>
            <div id="detail-body" tabindex="0"></div>
            <footer class="reader-foot"><span>静态样例 · 只读</span><span id="reader-position">说明文档</span></footer>
          </section>
        </aside>
      </section>
      <dialog id="reader-dialog" aria-label="工作面板"></dialog>
    </div>
  </main>
  <details class="review-notes"><summary>评审范围与未模拟项</summary><p>保留现有中性灰、雾蓝与系统字体，仅比较布局。候选的分栏阈值与交互时序尚待确认。手机为覆盖阅读；浏览器／系统返回、真实网络、保存与编辑不在模拟范围。重置会清空本页模拟消息与草稿。</p></details>
  <div id="announcement" class="visually-hidden" role="status" aria-live="polite"></div>
</body>
</html>
