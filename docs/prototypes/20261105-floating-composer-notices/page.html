<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>输入区浮层与提示重新设计</title>
  <link rel="stylesheet" href="./shared.css">
</head>
<body>
  <main class="review">
    <header class="review-head">
      <h1>输入区浮层与提示重新设计（ADR-20261105 P0）</h1>
      <p>评审稿，所有状态均为本页模拟。可以直接滚动消息列表：停在最底部为「跟随」，往上滚为「回看」。切换排队、附件和提示，比较两种情形下正文的表现。</p>
    </header>

    <section class="controls" aria-label="评审控制">
      <div class="control"><span>视口</span><div class="seg" data-key="viewport">
        <button type="button" data-value="mobile">手机 390</button><button type="button" data-value="desktop">桌面（含侧栏）</button>
      </div></div>
      <div class="control"><span>排队</span><div class="seg" data-key="queue">
        <button type="button" data-value="0">0</button><button type="button" data-value="1">1</button><button type="button" data-value="4">4</button>
      </div></div>
      <div class="control"><span>附件</span><div class="seg" data-key="atts">
        <button type="button" data-value="0">0</button><button type="button" data-value="2">2</button>
      </div></div>
      <div class="control"><span>连接与只读</span><div class="seg" data-key="conn">
        <button type="button" data-value="ok">正常</button>
        <button type="button" data-value="early">断线 3 秒后</button>
        <button type="button" data-value="late">断线 10 秒后</button>
        <button type="button" data-value="nonet">无网络</button>
        <button type="button" data-value="exited">Pi 已退出</button>
        <button type="button" data-value="history">本地历史</button>
        <button type="button" data-value="nosession">未打开会话</button>
      </div></div>
      <div class="control"><span>局部错误</span><div class="seg" data-key="error">
        <button type="button" data-value="off">无</button><button type="button" data-value="short">单行</button><button type="button" data-value="long">两行</button>
      </div></div>
      <div class="control"><span>安装提示</span><div class="seg" data-key="install">
        <button type="button" data-value="off">无</button><button type="button" data-value="on">显示</button>
      </div></div>
      <div class="control"><span>外观</span><div class="seg" data-key="theme">
        <button type="button" data-value="light">浅色</button><button type="button" data-value="dark">深色</button>
      </div></div>
      <button type="button" class="tool-btn" id="stream" aria-pressed="false">Pi 开始输出</button>
      <button type="button" class="tool-btn" id="outage">模拟一次断线（实时）</button>
      <button type="button" class="tool-btn" id="toast">触发 Toast</button>
      <button type="button" class="tool-btn" id="toMiddle">滚到中部（回看）</button>
      <button type="button" class="tool-btn" id="toBottom">回到底部（跟随）</button>
    </section>

    <div class="stage">
      <section class="device" id="device" aria-label="工作区预览">
        <aside class="sidebar" id="sidebar" aria-label="侧栏"></aside>
        <div class="main" id="main">
          <div class="statusbar only-mobile" aria-hidden="true"><span>9:41</span><span>●●●</span></div>
          <header class="titlebar" id="titlebar"></header>
          <div class="viewport">
            <div class="list" id="list" tabindex="0" aria-label="消息列表"></div>
            <div class="empty" id="empty" hidden></div>
            <div class="top-layer" id="topLayer" aria-live="polite"></div>
            <div class="footer" id="footer"><div class="footer-inner" id="footerInner"></div></div>
          </div>
        </div>
        <div class="scrim" id="scrim"></div>
        <nav class="mobile-nav" id="mobileNav" aria-label="导航"></nav>
      </section>
    </div>

    <aside class="notes" id="notes" aria-live="polite"></aside>
  </main>
  <script src="./shared.js"></script>
</body>
</html>
