name: pi-reach-e2e

services:
  relay:
    build:
      context: ../..
      dockerfile: relay/Dockerfile
    image: pi-reach-e2e-relay:local
    container_name: pi-reach-e2e-relay
    restart: unless-stopped
    environment:
      PI_REACH_RELAY_PORT: "3000"
    ports:
      - "127.0.0.1:18786:3000/tcp"
    networks:
      relay_host:
        aliases: [relay]
      relay_owner_b:
        aliases: [relay]
      relay_owner_c:
        aliases: [relay]
      control_relay: {}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  interactive:
    build:
      context: ../..
      dockerfile: docker/e2e/host/Dockerfile
    image: pi-reach-e2e-host:local
    container_name: pi-reach-e2e-interactive
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      HOME: /home/pi
      PI_CODING_AGENT_DIR: /home/pi/.pi/agent
      PI_CODING_AGENT_SESSION_DIR: /home/pi/.pi/agent/sessions
      PI_OFFLINE: "1"
      PI_TELEMETRY: "0"
      PI_REACH_ALLOW_FILE_IDENTITY: "1"
      PI_REACH_RELAY: http://relay:3000
      INTERACTIVE_CONTROL_PORT: "8787"
    volumes:
      - pi-reach-e2e-interactive-home:/home/pi
      - pi-reach-e2e-interactive-pi:/home/pi/.pi
      - pi-reach-e2e-interactive-sessions:/home/pi/.pi/agent/sessions
      - pi-reach-e2e-interactive-workspace:/workspace
    networks:
      relay_host: {}
      control_interactive: {}
    ports:
      - "127.0.0.1:18787:8787/tcp"

  owner-b:
    build:
      context: ../..
      dockerfile: docker/e2e/owner/Dockerfile
    image: pi-reach-e2e-owner:local
    container_name: pi-reach-e2e-owner-b
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      OWNER_NAME: owner-b
      OWNER_PORT: "8788"
      RELAY_URL: ws://relay:3000
      OWNER_STATE_DIR: /var/lib/pi-reach-owner
    volumes:
      - pi-reach-e2e-owner-b-state:/var/lib/pi-reach-owner
    networks:
      relay_owner_b: {}
      control_owner_b: {}
    ports:
      - "127.0.0.1:18788:8788/tcp"

  owner-c:
    image: pi-reach-e2e-owner:local
    container_name: pi-reach-e2e-owner-c
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      OWNER_NAME: owner-c
      OWNER_PORT: "8788"
      RELAY_URL: ws://relay:3000
      OWNER_STATE_DIR: /var/lib/pi-reach-owner
    volumes:
      - pi-reach-e2e-owner-c-state:/var/lib/pi-reach-owner
    networks:
      relay_owner_c: {}
      control_owner_c: {}
    ports:
      - "127.0.0.1:18789:8788/tcp"

networks:
  relay_host:
    name: pi-reach-e2e-relay-host
    internal: true
  relay_owner_b:
    name: pi-reach-e2e-relay-owner-b
    internal: true
  relay_owner_c:
    name: pi-reach-e2e-relay-owner-c
    internal: true
  control_relay:
    name: pi-reach-e2e-control-relay
  control_interactive:
    name: pi-reach-e2e-control-interactive
  control_owner_b:
    name: pi-reach-e2e-control-owner-b
  control_owner_c:
    name: pi-reach-e2e-control-owner-c

volumes:
  pi-reach-e2e-interactive-home:
    name: pi-reach-e2e-interactive-home
  pi-reach-e2e-interactive-pi:
    name: pi-reach-e2e-interactive-pi
  pi-reach-e2e-interactive-sessions:
    name: pi-reach-e2e-interactive-sessions
  pi-reach-e2e-interactive-workspace:
    name: pi-reach-e2e-interactive-workspace
  pi-reach-e2e-owner-b-state:
    name: pi-reach-e2e-owner-b-state
  pi-reach-e2e-owner-c-state:
    name: pi-reach-e2e-owner-c-state
